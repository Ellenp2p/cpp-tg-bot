name: Release

on:
  push:
    tags:
      - '*'

env:
  VCPKG_BINARY_SOURCES: files,${{ github.workspace }}/vcpkg-bincache,readwrite
  # Alpine(musl) 上 vcpkg 官方 cmake 4.4.3 是 glibc 预编译版跑不了，强制用系统工具链
  VCPKG_FORCE_SYSTEM_BINARIES: "1"

permissions:
  contents: write

jobs:
  build:
    name: release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-static
            os: ubuntu-latest
            container: alpine:3.22
            triplet: x64-linux-musl
            artifact: linux-x86_64-static
          - name: macos-arm64
            os: macos-latest
            triplet: arm64-osx
            artifact: macos-arm64
          - name: windows-x64
            os: windows-latest
            triplet: x64-windows-static
            artifact: windows-x86_64
    defaults:
      run:
        shell: bash

    steps:
      - name: Install toolchain (Alpine)
        if: ${{ matrix.name == 'linux-static' }}
        shell: sh
        run: |
          apk add --no-cache build-base cmake ninja git curl zip unzip tar \
                             perl linux-headers bash ca-certificates pkgconf

      - uses: actions/checkout@v4

      # 从 tag 解析要发布的机器人：
      #   group_admin-v0.0.1 / echo_bot-v0.0.1  → 只发该机器人
      #   v0.2.0                                  → 全部机器人
      - name: Resolve bots from tag
        id: meta
        run: |
          tag=${GITHUB_REF#refs/tags/}
          echo "tag=$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in
            v*) echo "bots=echo_bot group_admin" >> "$GITHUB_OUTPUT" ;;
            *)
              bot=${tag%%-v*}
              if [ ! -f "examples/$bot/main.cpp" ]; then
                echo "unknown bot '$bot' in tag '$tag'"
                exit 1
              fi
              echo "bots=$bot" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Enable long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      # 从框架仓库 Ellenp2p/tgbot 的 deps release 拉预编译依赖，
      # vcpkg install 变为纯恢复（秒级）。失败自动回退全量编译。
      - name: Fetch prebuilt vcpkg deps
        continue-on-error: true
        run: |
          base=https://github.com/Ellenp2p/tgbot/releases/download/deps
          curl -fsSL -o bincache.tar.gz "$base/vcpkg-bincache-${{ matrix.triplet }}.tar.gz"
          curl -fsSL -o vcpkg-commit.txt "$base/vcpkg-commit.txt"
          tar xzf bincache.tar.gz

      - name: Build (musl, fully static)
        if: ${{ matrix.name == 'linux-static' }}
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git .vcpkg
          if [ -f vcpkg-commit.txt ]; then
            sha=$(cat vcpkg-commit.txt)
            git -C .vcpkg fetch --depth 1 origin "$sha"
            git -C .vcpkg checkout --detach "$sha"
          fi
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-musl \
            -DTGBOT_STATIC=ON
          cmake --build build

      - name: Get vcpkg (macOS / Windows)
        if: ${{ matrix.name != 'linux-static' }}
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git .vcpkg
          if [ -f vcpkg-commit.txt ]; then
            sha=$(cat vcpkg-commit.txt)
            git -C .vcpkg fetch --depth 1 origin "$sha"
            git -C .vcpkg checkout --detach "$sha"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Build (macOS / Windows)
        if: ${{ matrix.name != 'linux-static' }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build --config Release

      # 打包：Windows 直接传 exe + cacert.pem（下载即跑）；
      # Linux/macOS 打 tar.gz（保留可执行权限，cacert.pem 一并打包）
      - name: Package
        run: |
          mkdir -p dist
          for bot in ${{ steps.meta.outputs.bots }}; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              cp "build/Release/$bot.exe" "dist/${bot}-${{ matrix.artifact }}.exe"
              [ -f build/Release/cacert.pem ] && cp build/Release/cacert.pem dist/
            else
              mkdir -p "dist/$bot"
              strip "build/$bot"
              cp "build/$bot" "dist/$bot/"
              [ -f build/cacert.pem ] && cp build/cacert.pem "dist/$bot/"
              tar -czf "dist/${bot}-${{ matrix.artifact }}.tar.gz" -C dist "$bot"
              rm -rf "dist/$bot"
            fi
          done
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: dist/*
          generate_release_notes: true
