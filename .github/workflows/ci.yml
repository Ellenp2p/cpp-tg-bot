name: CI

on:
  push:
  pull_request:

env:
  # Alpine(musl) 上 vcpkg 官方 cmake 是 glibc 预编译版跑不了，强制用系统工具链
  # 注意：VCPKG_BINARY_SOURCES 不在此设置——container job 不翻译 env 里的
  # 主机路径，统一在 step 里用 $GITHUB_WORKSPACE 设置（见 Set bincache path）
  VCPKG_FORCE_SYSTEM_BINARIES: "1"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux：在 Alpine 容器里用 musl 工具链编译，产出全静态二进制
          - name: linux-static
            os: ubuntu-latest
            container: alpine:3.22
            triplet: x64-linux-musl
          - name: macos-arm64
            os: macos-latest
            triplet: arm64-osx
          - name: windows-x64
            os: windows-latest
            triplet: x64-windows-static
    defaults:
      run:
        shell: bash

    steps:
      - name: Install toolchain (Alpine)
        if: ${{ matrix.name == 'linux-static' }}
        shell: sh
        run: |
          apk add --no-cache build-base cmake ninja git curl zip unzip tar \
                             perl linux-headers bash ca-certificates pkgconf

      - uses: actions/checkout@v4

      - name: Set bincache path
        run: echo "VCPKG_BINARY_SOURCES=files,$GITHUB_WORKSPACE/vcpkg-bincache,readwrite" >> "$GITHUB_ENV"

      - name: Enable long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      # 从框架仓库 Ellenp2p/tgbot 的 deps release 拉预编译依赖，
      # vcpkg install 变为纯恢复（秒级）。失败（首版未生成等）自动回退全量编译。
      - name: Fetch prebuilt vcpkg deps
        continue-on-error: true
        run: |
          base=https://github.com/Ellenp2p/tgbot/releases/download/deps
          curl -fsSL -o bincache.tar.gz "$base/vcpkg-bincache-${{ matrix.triplet }}.tar.gz"
          curl -fsSL -o vcpkg-commit.txt "$base/vcpkg-commit.txt"
          tar xzf bincache.tar.gz

      - name: Build (musl, fully static)
        if: ${{ matrix.name == 'linux-static' }}
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git .vcpkg
          if [ -f vcpkg-commit.txt ]; then
            sha=$(cat vcpkg-commit.txt)
            git -C .vcpkg fetch --depth 1 origin "$sha"
            git -C .vcpkg checkout --detach "$sha"
          fi
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-musl \
            -DTGBOT_STATIC=ON
          cmake --build build
          echo "=== linkage check ==="
          ldd build/echo_bot build/group_admin || echo "fully static"

      - name: Get vcpkg (macOS / Windows)
        if: ${{ matrix.name != 'linux-static' }}
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git .vcpkg
          if [ -f vcpkg-commit.txt ]; then
            sha=$(cat vcpkg-commit.txt)
            git -C .vcpkg fetch --depth 1 origin "$sha"
            git -C .vcpkg checkout --detach "$sha"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Build (macOS / Windows)
        if: ${{ matrix.name != 'linux-static' }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-bot-${{ matrix.name }}
          path: |
            build/echo_bot
            build/group_admin
            build/Release/echo_bot.exe
            build/Release/group_admin.exe
            build/cacert.pem
            build/Release/cacert.pem
          if-no-files-found: ignore
