name: CI

on:
  push:
  pull_request:

env:
  # vcpkg 二进制缓存目录（各平台共用，配合 actions/cache 加速）
  VCPKG_BINARY_SOURCES: files,${{ github.workspace }}/vcpkg-bincache,readwrite
  # Alpine(musl) 上 vcpkg 官方 cmake 4.4.3 是 glibc 预编译版跑不了，强制用系统工具链
  VCPKG_FORCE_SYSTEM_BINARIES: "1"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux：在 Alpine 容器里用 musl 工具链编译，产出全静态二进制
          - name: linux-static
            os: ubuntu-latest
            container: alpine:3.22
            triplet: x64-linux-musl
          - name: macos-arm64
            os: macos-latest
            triplet: arm64-osx
          - name: windows-x64
            os: windows-latest
            triplet: x64-windows-static
    defaults:
      run:
        shell: bash

    steps:
      - name: Install toolchain (Alpine)
        if: ${{ matrix.name == 'linux-static' }}
        shell: sh
        run: |
          apk add --no-cache build-base cmake ninja git curl zip unzip tar \
                             perl linux-headers bash ca-certificates pkgconf

      - uses: actions/checkout@v4

      - name: Enable long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Build (musl, fully static)
        if: ${{ matrix.name == 'linux-static' }}
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git .vcpkg
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-musl \
            -DTB_STATIC=ON
          cmake --build build
          echo "=== linkage check ==="
          ldd build/tg_bot || echo "fully static"

      - name: Get vcpkg (macOS / Windows)
        if: ${{ matrix.name != 'linux-static' }}
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git .vcpkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Build (macOS / Windows)
        if: ${{ matrix.name != 'linux-static' }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-bot-${{ matrix.name }}
          path: |
            build/tg_bot
            build/Release/tg_bot.exe
            build/cacert.pem
            build/Release/cacert.pem
          if-no-files-found: ignore
