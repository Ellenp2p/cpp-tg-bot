global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: warden
    metrics_path: /metrics
    static_configs:
      # Warden 的 health/metrics 端口默认只监听回环地址。
      # Prometheus 在 Docker 里时改成 host.docker.internal:9090。
      - targets: ["127.0.0.1:9090"]
        labels:
          service: warden
